name: CD
on:
  push:
    branches: [main, 'support/v*']
permissions:
  contents: read
jobs:
  identity:
    name: Reserve a build number
    # A new support branch starts at an already-numbered main build; its own builds begin with its next commit.
    if: ${{ !(github.event.created && startsWith(github.ref, 'refs/heads/support/')) }}
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: write
    outputs:
      build: ${{ steps.reserve.outputs.build }}
      major: ${{ steps.reserve.outputs.major }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_number=$(python3 scripts/release.py reserve --sha "$GITHUB_SHA")
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "major=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from version import release_major; print(release_major())')" >> "$GITHUB_OUTPUT"
  # Both configs are built and tested: dev for the suites a PR ran, release because it's what ships and CFI
  # only runs there. Each also saves its out/ cache for the PRs that follow. Each target is its own job, so
  # linux-arm64's tests wait only for linux-arm64's builds.
  build-linux-amd64:
    name: "Build and test Linux amd64 (${{ matrix.config == 'dev' && 'development' || 'release' }})"
    needs: identity
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        config: [dev, release]
    runs-on: [self-hosted, lanescape-browser-ci, 'run-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-amd64-${{ matrix.config }}']
    env:
      LANESCAPE_BROWSER_BUILD: ${{ needs.identity.outputs.build }}
      RELEASE_MAJOR: ${{ needs.identity.outputs.major }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/build-embedder
        with:
          target: linux-amd64
          config: ${{ matrix.config }}
      # Why the build ran what it ran, from Siso's own record, kept whether or not the build passed.
      - name: Keep the build's explanation
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: siso-explain-linux-amd64-${{ matrix.config }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Checks that need no Chromium
        if: matrix.config == 'dev'
        run: python3 scripts/ci_build.py checks
      - name: Suites
        run: python3 scripts/ci_build.py suites --target linux-amd64
      - name: Launch check
        if: matrix.config == 'release'
        run: python3 scripts/ci_build.py launch --target linux-amd64
      # The file that was tested is the file that's published.
      - name: Keep the package for publishing
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-linux-amd64
          path: dist/lanescape-browser-linux-amd64.tar.gz
          retention-days: 1
          compression-level: 0
  build-linux-arm64:
    name: "Build Linux arm64 (${{ matrix.config == 'dev' && 'development' || 'release' }})"
    needs: identity
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        config: [dev, release]
    runs-on: [self-hosted, lanescape-browser-ci, 'run-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-arm64-${{ matrix.config }}']
    env:
      LANESCAPE_BROWSER_BUILD: ${{ needs.identity.outputs.build }}
      RELEASE_MAJOR: ${{ needs.identity.outputs.major }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/build-embedder
        with:
          target: linux-arm64
          config: ${{ matrix.config }}
      # Why the build ran what it ran, from Siso's own record, kept whether or not the build passed.
      - name: Keep the build's explanation
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: siso-explain-linux-arm64-${{ matrix.config }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Hand off to the test machine
        run: python3 scripts/ci_build.py upload --target linux-arm64 --config '${{ matrix.config }}'
      # Published only after the test machine passes it, below.
      - name: Keep the package for publishing
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-linux-arm64
          path: dist/lanescape-browser-linux-arm64.tar.gz
          retention-days: 1
          compression-level: 0
  test-linux-arm64:
    name: Test Linux arm64 (development and release)
    needs: [identity, build-linux-arm64]
    timeout-minutes: 120
    runs-on: [self-hosted, lanescape-browser-ci, 'run-${{ github.run_id }}-${{ github.run_attempt }}-test-linux-arm64']
    env:
      LANESCAPE_BROWSER_BUILD: ${{ needs.identity.outputs.build }}
      RELEASE_MAJOR: ${{ needs.identity.outputs.major }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install what the suites need
        run: python3 scripts/ci_build.py install-test-packages
      - name: Fetch the dev build
        run: python3 scripts/ci_build.py download --target linux-arm64 --config dev
      - name: Suites on dev
        run: python3 scripts/ci_build.py suites --target linux-arm64
      - name: Fetch the release build
        run: python3 scripts/ci_build.py download --target linux-arm64 --config release
      - name: Suites on release
        run: python3 scripts/ci_build.py suites --target linux-arm64
      - name: Launch check
        run: python3 scripts/ci_build.py launch --target linux-arm64
  # On Blacksmith's Macs, which sign in to Google Cloud with GitHub's token as the main identity (ci/README.md).
  build-macos-arm64:
    name: "Build and test macOS arm64 (${{ matrix.config == 'dev' && 'development' || 'release' }})"
    needs: identity
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config: [dev, release]
    runs-on: blacksmith-12vcpu-macos-26
    permissions:
      contents: read
      id-token: write
    env:
      LANESCAPE_BROWSER_BUILD: ${{ needs.identity.outputs.build }}
      RELEASE_MAJOR: ${{ needs.identity.outputs.major }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/macos-runner
        with:
          identity: main
          provider: ${{ vars.GCP_CI_WIF_PROVIDER }}
      - uses: ./.github/actions/build-embedder
        with:
          target: macos-arm64
          config: ${{ matrix.config }}
      # Why the build ran what it ran, from Siso's own record, kept whether or not the build passed.
      - name: Keep the build's explanation
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: siso-explain-macos-arm64-${{ matrix.config }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Suites
        run: python3 scripts/ci_build.py suites --target macos-arm64
      - name: Launch check
        if: matrix.config == 'release'
        run: python3 scripts/ci_build.py launch --target macos-arm64
      - name: Keep the package for publishing
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-macos-arm64
          path: dist/lanescape-browser-macos-arm64.tar.gz
          retention-days: 1
          compression-level: 0
  # Only after every target's tests pass: scripts/publish.py needs every published target.
  publish:
    name: Publish
    needs: [identity, build-linux-amd64, build-linux-arm64, test-linux-arm64, build-macos-arm64]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: read
      id-token: write
    steps:
      # Promotion compares this commit's history with latest's, so it needs every commit and build tag.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Publish
        env:
          BUILD_NUMBER: ${{ needs.identity.outputs.build }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: python3 scripts/publish.py
      # Only for a major marked unstable in Cargo.toml; a stable one waits for the Promote build workflow.
      # Forward-only and safe against other promotions in any order (specs/0004-releases.md).
      - name: Promote an unstable major
        env:
          BUILD_NUMBER: ${{ needs.identity.outputs.build }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: python3 scripts/release.py promote --build "$BUILD_NUMBER" --if-unstable
