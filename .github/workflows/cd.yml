name: CD

# Every push to main or a support branch: what CI runs, so that main's caches are main's own (ci/README.md).
# Publishing comes later (README.md, Current limitations).

on:
  push:
    branches: [main, 'support/v*']

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'lanescape-16vcpu-linux-amd64' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: lanescape/runners/actions/checkout@v1
      - name: Install Rust
        run: |
          set -euo pipefail
          # Cargo links build scripts and procedural macros with the machine's own C compiler.
          if ! command -v rustup >/dev/null || ! command -v cc >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends rustup gcc libc6-dev
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal \
            --component rustfmt --component clippy
      - name: Checks
        run: python3 scripts/ci.py checks

  linux-amd64:
    name: linux-amd64
    needs: checks
    uses: ./.github/workflows/target.yml
    permissions:
      contents: read
    with:
      target: linux-amd64

  linux-arm64:
    name: linux-arm64
    needs: checks
    uses: ./.github/workflows/target.yml
    permissions:
      contents: read
    with:
      target: linux-arm64

  macos-arm64:
    name: macos-arm64
    needs: checks
    uses: ./.github/workflows/target.yml
    permissions:
      contents: read
      id-token: write
    with:
      target: macos-arm64
