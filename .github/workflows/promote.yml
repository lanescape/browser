name: Promote build
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number to promote (YYYYMMDD.N); vN/latest only moves forward to it
        required: true
        type: string
permissions:
  contents: read
jobs:
  identify:
    name: Find the build's major
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/support/v') }}
    runs-on: lanescape-2vcpu-linux-amd64
    outputs:
      major: ${{ steps.major.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: major
        env:
          BUILD: ${{ inputs.build }}
        run: |
          major=$(python3 scripts/release.py major --build "$BUILD")
          echo "major=$major" >> "$GITHUB_OUTPUT"
  promote:
    name: Promote the build
    needs: identify
    runs-on: lanescape-2vcpu-linux-amd64
    # The environment's required reviewers approve each promotion, and it holds the R2 token that may write the
    # release bucket.
    environment: promote
    # Serializing promotions of a major only saves retries: the ETag-matched write of
    # vN/latest keeps concurrent promotions forward-only in any order. A build number contested
    # in a reservation race may name two majors here, such as v1,v2.
    concurrency:
      group: release-${{ needs.identify.outputs.major }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD: ${{ inputs.build }}
        run: python3 scripts/release.py promote --build "$BUILD"
