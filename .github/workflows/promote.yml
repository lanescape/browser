name: Promote build
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number to promote (YYYYMMDD.N); vN/latest only moves forward to it
        required: true
        type: string
permissions:
  contents: read
jobs:
  identify:
    name: Find the build's major
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/support/v') }}
    runs-on: lanescape-2vcpu-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The repository's tooling, tools/browser, at go.mod's Go. No cache: nothing a pull request wrote reaches
      # main's or a published build.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Before anyone is asked to approve: the number names a build, tagged under its package major.
      - name: Check the build number
        env:
          BUILD: ${{ inputs.build }}
        run: go run ./tools/browser release major --build "$BUILD"
  promote:
    name: Promote the build
    needs: identify
    runs-on: lanescape-2vcpu-linux-amd64
    # The environment's required reviewers approve each promotion, and it holds the R2 token that may write the
    # release bucket.
    environment: promote
    # No concurrency group: GitHub would cancel a waiting promotion for a newer dispatch. The
    # ETag-matched write of vN/latest keeps concurrent promotions forward-only in any order.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The repository's tooling, tools/browser, at go.mod's Go. No cache: nothing a pull request wrote reaches
      # main's or a published build.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD: ${{ inputs.build }}
        run: go run ./tools/browser release promote --build "$BUILD"
