name: Image
# The runners read the image's key from this title, since a dispatch's inputs don't show in the runs API.
run-name: Image ${{ inputs.tag }} ${{ inputs.commit }} ${{ inputs.key }}
# Dispatched on main by the runners when a build machine needs a build image no one has made: prepares a
# machine as a build would, then leaves its disk for the runners to make into the image. Only a run on main gets a
# machine. See ci/README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Chromium release tag, for example 157.0.8103.39
        required: true
        type: string
      commit:
        description: The commit that tag names
        required: true
        type: string
      key:
        description: The image's key, from the runners
        required: true
        type: string
permissions:
  contents: read
env:
  # gcloud and gsutil, which depot_tools uses, keep their access tokens in memory, never on the disk that becomes
  # the image, where a build could recover one of the image identity's while it still works.
  CLOUDSDK_CONFIG: /dev/shm/lanescape-browser-gcloud
  BOTO_CONFIG: /dev/shm/lanescape-browser-boto
jobs:
  image:
    name: Build the CI/CD machine image
    timeout-minutes: 240
    runs-on: [self-hosted, lanescape-browser-ci, 'run-${{ github.run_id }}-${{ github.run_attempt }}-image-linux-x64']
    steps:
      # Nothing of the checkout's credentials may reach the image.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Keep gsutil's tokens in memory
        run: printf '[GSUtil]\nstate_dir = /dev/shm/lanescape-browser-gsutil\n' >"$BOTO_CONFIG"
      - name: Check and write the pin
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_COMMIT: ${{ inputs.commit }}
          IMAGE_KEY: ${{ inputs.key }}
        run: python3 scripts/ci_image.py pin --tag "$IMAGE_TAG" --commit "$IMAGE_COMMIT" --key "$IMAGE_KEY"
      # Restores the source pack, or syncs and saves one for a new pin, then installs what builds need.
      - name: Prepare
        run: python3 scripts/ci_build.py prepare --target linux-amd64
      - name: Make the disk safe to image
        run: sudo python3 scripts/ci_image.py finish --home "$HOME"
