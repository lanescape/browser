name: Build the embedder
description: Restore source and out/, compile whatever is out of date, save out/, then package.
inputs:
  target:
    description: Target in engine/targets.json
    required: true
  config:
    description: dev or release
    required: true
runs:
  using: composite
  steps:
    - name: Restore source
      shell: bash
      run: python3 scripts/ci_build.py prepare --target '${{ inputs.target }}'
    - name: Restore out
      shell: bash
      run: python3 scripts/ci_build.py restore-out --target '${{ inputs.target }}' --config '${{ inputs.config }}'
    # Prints as it goes, so a long compile shows its progress in the live log.
    - name: Compile
      shell: bash
      run: python3 scripts/ci_build.py compile --target '${{ inputs.target }}' --config '${{ inputs.config }}'
    - name: Save out
      shell: bash
      run: python3 scripts/ci_build.py save-out --target '${{ inputs.target }}' --config '${{ inputs.config }}'
    - name: Package
      shell: bash
      run: python3 scripts/ci_build.py package --target '${{ inputs.target }}' --config '${{ inputs.config }}'
