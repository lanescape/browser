name: Prepare a macOS runner
description: Python for CI's scripts, and gcloud signed in as one of CI's identities through GitHub's token.
inputs:
  identity:
    description: main or pr, as CI's cloud sign-in allows each workflow (ci/README.md)
    required: true
  provider:
    description: The workload identity provider, from the GCP_CI_WIF_PROVIDER variable
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.13'
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.provider }}
        service_account: lanescape-browser-ci-${{ inputs.identity }}@lanescape-dev.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v3.0.1
